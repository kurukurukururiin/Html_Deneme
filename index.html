    <style>
        
        body {
            background-color: #121212;
            color: #b6b6b6;

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;

        h2 {

        .link-kutusu {

            background-color: #1f1f1f;
            color: #b6b6b6;
            width: 320px;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .link-kutusu:hover {
            background-color: #2a2a2a;
            transform: translateY(-3px);
        }

        .link-kutusu img {
            width: 24px;
            height: 24px;
            margin-right: 15px;
        }

    </style>
</head>
